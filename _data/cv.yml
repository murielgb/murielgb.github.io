  summary: Evolutionary biologist studying the diversity, domestication, and
    evolutionary history of the date palm (Phoenix dactylifera) and other crops.
    My research combines population genomics, archaeogenomics, archaeobotany,
    and ethnobotany to understand how crop diversity emerged and evolved
    through interactions between humans and plants.

