cv:
  name: Muriel Gros-Balthazard
  label: Research scientist in evolutionary biology
  email: muriel.gros-balthazard@ird.fr
  location: Montpellier, France
  image: ""
  summary: Evolutionary biologist studying the diversity, domestication, and
    evolutionary history of the date palm (_Phoenix dactylifera_) and its wild
    relatives. My research combines population genomics, archaeogenomics,
    archaeobotany, seed morphometrics, and ethnobotany to understand how crop
    diversity emerged and evolved through interactions between humans and plants.

